<body class="bg-surface-dim font-body-md text-on-surface antialiased flex justify-center items-center min-h-screen p-md md:p-xl">
<!-- Modal / Full Screen Overlay Container -->
<main class="w-full max-w-4xl bg-surface-container-lowest rounded-xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] overflow-hidden flex flex-col max-h-[90vh]">
<!-- Header -->
<header class="flex items-center justify-between px-lg py-md border-b border-outline-variant bg-surface-container-lowest">
<div class="flex items-center gap-md">
<button class="p-2 rounded-full hover:bg-surface-container-highest transition-colors text-on-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">編輯記事</h1>
</div>
<div class="flex items-center gap-sm">
<button class="text-error hover:bg-error-container hover:text-on-error-container px-4 py-2 rounded-lg font-label-md text-label-md transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]" data-icon="delete">delete</span>
                    刪除
                </button>
</div>
</header>
<!-- Scrollable Content Area -->
<div class="flex-1 overflow-y-auto p-lg flex flex-col gap-lg">
<!-- Top Controls Row: Date & Category -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<!-- Date Picker -->
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant">日期</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="calendar_today">calendar_today</span>
<input class="w-full pl-10 pr-3 py-2 border border-outline-variant rounded-lg bg-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none font-body-md text-body-md text-on-surface transition-all" type="date" value="2024-05-15"/>
</div>
</div>
<!-- Category Dropdown -->
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant">分類</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="folder">folder</span>
<select class="w-full pl-10 pr-3 py-2 border border-outline-variant rounded-lg bg-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none font-body-md text-body-md text-on-surface appearance-none transition-all">
<option value="work">工作日誌</option>
<option selected="" value="personal">個人反思</option>
<option value="ideas">靈感筆記</option>
<option value="meeting">會議記錄</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="arrow_drop_down">arrow_drop_down</span>
</div>
</div>
</div>
<!-- Title Input -->
<div class="flex flex-col gap-sm">
<input class="w-full px-0 py-2 border-0 border-b-2 border-transparent hover:border-outline-variant focus:border-primary bg-transparent outline-none font-display-lg text-display-lg text-on-surface placeholder:text-outline-variant transition-colors" placeholder="無標題記事" type="text" value="關於近期專案架構的重構想法與心智圖草稿"/>
</div>
<!-- Tag Chips -->
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]" data-icon="sell">sell</span> 標籤
                </label>
<div class="flex flex-wrap gap-sm items-center p-2 border border-outline-variant rounded-lg bg-surface">
<!-- Chip -->
<div class="flex items-center gap-1 bg-secondary-container text-on-secondary-container px-3 py-1 rounded-full font-label-sm text-label-sm">
                        架構設計
                        <button class="hover:text-error transition-colors flex items-center justify-center rounded-full p-0.5">
<span class="material-symbols-outlined text-[14px]" data-icon="close">close</span>
</button>
</div>
<!-- Chip -->
<div class="flex items-center gap-1 bg-secondary-container text-on-secondary-container px-3 py-1 rounded-full font-label-sm text-label-sm">

<span class="material-symbols-outlined text-[14px]" data-icon="close">close</span>

<button class="p-1.5 rounded hover:bg-surface-container-highest text-on-surface-variant transition-colors" title="底線"><span class="material-symbols-outlined text-[20px]" data-icon="format_underlined">format_underlined</span></button>
<div class="w-px h-5 bg-outline-variant mx-1"></div>
<button class="p-1.5 rounded hover:bg-surface-container-highest text-on-surface-variant transition-colors" title="標題"><span class="material-symbols-outlined text-[20px]" data-icon="format_h1">format_h1</span></button>
<button class="p-1.5 rounded hover:bg-surface-container-highest text-on-surface-variant transition-colors" title="引言"><span class="material-symbols-outlined text-[20px]" data-icon="format_quote">format_quote</span></button>

<div class="w-px h-5 bg-outline-variant mx-1"></div>

<button class="p-1.5 rounded hover:bg-surface-container-highest text-on-surface-variant transition-colors" title="有序清單"><span class="material-symbols-outlined text-[20px]" data-icon="format_list_numbered">format_list_numbered</span></button>
<div class="flex-1"></div>
<button class="flex items-center gap-1 px-3 py-1.5 rounded-lg bg-surface-container-highest hover:bg-surface-variant text-on-surface font-label-sm text-label-sm transition-colors">
<span class="material-symbols-outlined text-[16px]" data-icon="visibility">visibility</span> 預覽
                    </button>
</div>
<textarea class="w-full flex-1 p-4 border border-outline-variant rounded-b-lg bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary outline-none font-body-md text-body-md text-on-surface resize-none leading-relaxed transition-all" placeholder="開始撰寫內容...">今天花了一些時間重新審視目前的專案架構。發現有幾個模組的耦合度過高，導致在加入新功能時容易產生非預期的副作用。

### 發現的問題點：
1. **User Authentication Module**: 處理邏輯與 UI 元件綁得太緊。
2. **Data Fetching Layer**: 缺乏統一的錯誤處理機制，各個頁面各自為政。

### 預計改善方向：
- 引入更嚴格的 Dependency Injection 模式。
- 建立統一的 API Gateway class 來攔截與處理 HTTP errors。
- 考慮將狀態管理逐步遷移至更輕量級的解決方案。

需要與團隊討論這會不會影響目前的交付時程。可以先從小模組開始重構測試看看水溫。</textarea>

</div>
